# Example Symphonist project. Copy to ~/.symphonist/projects/<anything>.yaml (or $SYMPHONIST_HOME/projects/) and
# replace the placeholder values, or use the dashboard's Add project. Field names are camelCase. Invalid files are
# logged and skipped by the host.

id: orders                      # unique project id; used in CLI commands (symphonist show orders ORD-1)
name: Orders (Acme)             # display name (defaults to id)

tracker:
  type: jira                    # "jira" or "github-projects" (see orders-github.example.yaml)
  site: https://acme.atlassian.net
  projectKey: ACME                # Jira project key; the setup screen reads its statuses from it (optional)
  email: dev@example.com        # Atlassian account email (basic auth with the API token)
  tokenSecret: jira-acme        # name of the secret holding the Atlassian API token: symphonist secret set jira-acme
  # Tickets Symphonist works on. A ticket that stops matching is Blocked ("no longer matches tracker query").
  jql: assignee = currentUser() AND labels = Claude AND statusCategory != Done

repo:
  type: bitbucket               # "bitbucket" or "github" (see orders-github.example.yaml)
  workspace: acme               # Bitbucket workspace id
  slug: orders                  # repository slug
  # Existing local clone (placeholder: replace with yours). Use an absolute path: a relative path resolves against the
  # projects folder (the folder holding this file), and "~" is not expanded.
  localPath: C:/src/acme-orders
  mainBranch: main              # default: main (feature PRs target it)
  productionBranch: production  # default: production (release PRs target it)
  email: dev@example.com        # Bitbucket account email
  tokenSecret: bitbucket-acme   # secret holding the Bitbucket API token: symphonist secret set bitbucket-acme
  # mergeStrategy: merge_commit # default: merge_commit

build:
  type: bitbucket-pipelines     # build/release status is read from Bitbucket Pipelines, or "github-actions"
                                # (needs repo.type: github)
  # timeoutMinutes: 45          # default: 45

agent:
  type: claude-code             # "claude-code" or "codex" (Codex runs only with isolation: container)
  # Codex sign-in, used by any job that runs Codex:
  # codex:
  #   auth: api-key               # "api-key" (secret below) or "chatgpt" (run "codex login" once on this machine)
  #   apiKeySecret: openai-api-key  # default; api-key only: symphonist secret set openai-api-key
  # isolation: container        # default: container (Docker sandbox). "host" runs claude directly on this machine;
  #                             # host isolation REQUIRES allowedTools, e.g. allowedTools: [Read, Edit, "Bash(git:*)"]
  # allowedTools: []            # passed to claude --allowedTools (host mode only)
  # Extra hosts the container may reach, on top of the built-in Claude Code ones (api.anthropic.com,
  # statsig.anthropic.com, sentry.io). The firewall only permits HTTPS/HTTP (TCP 443/80) to these hosts.
  allowedDomains: [api.nuget.org, registry.npmjs.org]
  # timeoutMinutes: 60          # per agent run; default: 60
  # model: ""                   # optional Claude model override
  # image: ""                   # optional Docker image; default: the image built from the bundled Dockerfile
  # Extra tools baked into the agent image (container isolation only), installed when the host builds the image at
  # startup, so the agent can use them behind the firewall. One package per item, optionally with a version.
  # pip packages go into a virtualenv on PATH (python3 is added for you); npm packages are installed globally.
  # packages:
  #   apt: [ripgrep]
  #   pip: [graphifyy]            # the graphify CLI
  #   npm: []

# Failed attempts per stage before the ticket is Blocked (see: symphonist unblock). Default: 3.
# maxAttemptsPerStage: 3

# Comments starting with this ask Symphonist to rerun a stage, on the ticket or the pull request. An "@" and a name of
# letters, digits, "-" and "_" (at most 39 characters), matched without regard to case. Keep the quotes: a bare "@"
# is not valid YAML. Default: "@claude".
# commentMarker: "@claude"

# Stages run in order; the last one must be kind "done".
#   kind:                triage | plan | implement | build | uat | release | deploy | done
#   gate:                human = wait for approval (symphonist approve, or move the card to approvedWhenStatus);
#                        none (default) = continue automatically
#                        auto = approve automatically when the reviewer judges low risk (triage, plan, implement,
#                               release only; needs review.mode: active, otherwise it waits for you like human)
#   entryStatuses:       tracker statuses that mean "start at this stage" when a ticket is first picked up
#   onEnterStatus:       move the card to this status when the stage starts
#   onGateStatus:        move the card to this status when the stage is waiting for your approval
#   approvedWhenStatus:  moving the card to this status approves the stage
# Moving a card backwards to an earlier stage's status sends it back; your latest comment that does not end with
# "— posted by Symphonist" is passed to the agent as feedback.
pipeline:
  - { id: triage,    kind: triage,    gate: human, entryStatuses: [Backlog], approvedWhenStatus: Planned }
  - { id: plan,      kind: plan,      gate: human, entryStatuses: [Planned], onEnterStatus: Planned, approvedWhenStatus: In Progress }
  # A stage can run another provider: add  agent: { type: codex, model: "", timeoutMinutes: 30 }  to its line.
  # Without a model, the provider's default model is used.
  - { id: implement, kind: implement, gate: human, onEnterStatus: In Progress, onGateStatus: In Review }
  - { id: build,     kind: build }
  - { id: release,   kind: release,   gate: human }
  - { id: deploy,    kind: deploy }
  - { id: done,      kind: done,      onEnterStatus: Done }

# Areas the risk reviewer must treat as high risk. A change that touches one of the paths can never be auto-approved.
riskAreas:
  - name: pricing
    description: Anything that changes how order prices, discounts or tax are computed.
    paths: ["src/Pricing/**", "src/Orders/Discounts/**"]

# Risk reviewer (a read-only agent that judges each gate). mode:
#   off     = no reviewer runs (default); gate: auto behaves like human
#   shadow  = the reviewer judges every gated stage of kind triage/plan/implement/release, but nothing is
#             auto-approved. Set this to start collecting verdicts
#   active  = like shadow, and gate: auto stages are approved automatically when the verdict is low risk
# gate: auto only takes effect with mode: active.
review:
  mode: off
  # prompt: prompts/review.md   # optional prompt override, relative to this file
  # agent: { type: claude-code, model: "", timeoutMinutes: 20, allowedTools: [] }  # type may be codex; inherits the rest from agent
  #   host mode: allowedTools defaults to [Read, Grep, Glob], and a review refuses to run with any other tool

# Optional: after a gated implement round is pushed, an agent runs the app and reports what it saw (tests, screenshots)
# on the PR and the dashboard. Evidence is advice for you; it never approves or blocks anything and never pushes.
#   mode: off       = never
#         high-risk = when the reviewer says high or a risk-area path is touched (the default)
#         always    = every gated implement round
# evidence:
#   mode: high-risk
#   # prompt: prompts/evidence.md   # optional prompt override, relative to this file
#   run:                            # how to start the app; every field is optional and single-line except notes
#     setup: [npm ci]               # at most 10 commands, run in order
#     start: npm start
#     url: http://localhost:3000
#     ready: /health                # what to wait for before using the app
#     notes: Sign in as demo@example.com   # free text for the agent
#   features:                       # at most 20; things to exercise, in your own words
#     - { name: Checkout, steps: Add an item to the basket and pay with the test card }
#   agent: { type: codex, timeoutMinutes: 30, model: "" }   # the only keys allowed here; the rest comes from agent

# Optional: comments on the pull request that tag @claude (from you) are applied as a fix run.
# prComments:
#   fromOthers: false   # default. true also acts on teammates' comments. Trust note: they then direct an agent
#                       # that pushes under your account, so enable it only for a team you trust

# Optional prompt overrides per stage kind, as files relative to this file. Uncomment once the file exists.
# prompts:
#   plan: prompts/plan.md
